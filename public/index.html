<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HookVault — Dashboard</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --card: #171a21;
        --line: #262b36;
        --text: #e6e9ef;
        --muted: #9aa4b2;
        --ok: #3fb950;
        --warn: #d29922;
        --bad: #f85149;
        --accent: #58a6ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 24px;
        border-bottom: 1px solid var(--line);
      }
      header h1 { font-size: 16px; margin: 0; letter-spacing: 0.2px; }
      .badge {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      main { padding: 24px; display: grid; gap: 16px; max-width: 1000px; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
      }
      .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin: 0 0 12px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
      th { color: var(--muted); font-weight: 600; font-size: 12px; }
      .status-success { color: var(--ok); }
      .status-failed { color: var(--warn); }
      .status-dead { color: var(--bad); }
      .pill { display: inline-block; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
      .muted { color: var(--muted); }
      code { background: #0b0d11; padding: 1px 6px; border-radius: 5px; }
      .empty { color: var(--muted); padding: 8px 10px; }
    </style>
  </head>
  <body>
    <header>
      <h1>HookVault</h1>
      <span class="badge" id="tier">tier: …</span>
      <span class="badge" id="version">v…</span>
      <span class="badge" id="status">…</span>
    </header>
    <main>
      <section class="card">
        <h2>Active features</h2>
        <div id="features"><span class="empty">Loading…</span></div>
      </section>
      <section class="card">
        <h2>Recent deliveries</h2>
        <table>
          <thead>
            <tr><th>When</th><th>Event</th><th>Endpoint</th><th>Attempt</th><th>Status</th><th>Code</th></tr>
          </thead>
          <tbody id="deliveries"></tbody>
        </table>
        <div class="empty" id="deliveries-empty" hidden>No deliveries yet. POST an event to <code>/ingest</code>.</div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
